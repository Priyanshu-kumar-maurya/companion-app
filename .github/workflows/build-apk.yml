name: Build & Release Coffeely Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Coffeely APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x android/gradlew

      - name: Accept Android SDK Licenses & Ensure Platforms
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Build React Web App
        env:
          CI: false
          GENERATE_SOURCEMAP: false
        run: |
          npm run build

      - name: Sync Web Assets to Android Assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r build/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Build Android Debug APK with Gradle
        id: gradle_build
        continue-on-error: true
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../gradle_output.txt
          exit ${PIPESTATUS[0]}

      - name: Upload Build Log if Failed
        if: steps.gradle_build.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gradle-error-log
          path: gradle_output.txt

      - name: Fail if Gradle Failed
        if: steps.gradle_build.outcome != 'success'
        run: |
          echo "===== GRADLE FAILURE LOG (TAIL 100 LINES) ====="
          tail -n 100 gradle_output.txt
          exit 1

      - name: Locate and Prepare Coffeely APK
        run: |
          mkdir -p build-output
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK file not found in android/app/build/outputs/apk!"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" ./coffeely.apk
          cp "$APK_FILE" ./build-output/coffeely.apk
          ls -lh ./coffeely.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coffeely-apk
          path: coffeely.apk
          retention-days: 30

      - name: Publish Coffeely APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.4.4
          name: "Coffeely App v2.4.4 (Official APK)"
          body: |
            ### ☕ Coffeely Android App v2.4.4
            
            Official installable Android APK package for **Coffeely** - Safe & Verified Companion Booking Platform.
            
            #### 🆕 What's New in v2.4.4:
            - 📡 **Smart Offline Mode**: Elegant top notification banner when internet is disconnected.
            - ⚡ **Instant Reconnect**: Back Online notification with automatic live sync when internet returns.
            - 🔒 **Accurate Auth & Validation**: Clear error messages for wrong passwords, unverified accounts, and network timeouts (no generic "Server error").
            - 🚀 **Session Persistence**: Users remain logged in even if opening app without an active connection.
            - 🔑 **Permanent Keystore Signature**: Built with permanent debug.keystore for seamless updates without package conflicts.
            - ☕ **Brand-New Official Coffeely Logo**: Replaced old cube box with authentic coffee cup with rising heart steam on app icon, splash screen, and throughout the app.
            - ⚡ **Vercel & CI Fixes**: Cleaned build warnings, added SPA rewrites.
            - 🚀 **Server Reconnect**: Clear server wake-up feedback for free instance spin-ups.
            - 🎨 **Official Coffeely App Icon**: Replaced default Capacitor icon with high-res dark Coffeely branding across all device resolutions.
            - 🌟 **Custom Splash Screen**: Smooth themed splash screen on app launch.
            - 📹 **Camera & Microphone Auto-Permission**: Fixed WebRTC video & voice call permissions in Android WebView.
            - 🔙 **Android Hardware Back-Button Support**: Pressing back navigates screens smoothly instead of closing the app.
            - 📱 **Edge-to-Edge Safe Area Insets**: Fixed top notch / status bar and bottom navigation bar overlap.
            - 🚫 **Suppressed PWA Banner in Native APK**: Pure native look and feel without browser prompts.
            
            #### 📥 Direct Download:
            - **[Click here to Download coffeely.apk](https://github.com/Priyanshu-kumar-maurya/companion-app/releases/download/v2.4.1/coffeely.apk)**
            - **[Always Download Latest APK](https://github.com/Priyanshu-kumar-maurya/companion-app/releases/latest/download/coffeely.apk)**
            
            #### 📱 Installation Instructions:
            1. Download `coffeely.apk` directly on your Android mobile.
            2. Tap the downloaded file in your browser downloads or Files app.
            3. If prompted with *"For your security, your phone is not allowed to install unknown apps from this source"*, tap **Settings** and enable **"Allow from this source"**.
            4. Tap **Install** and launch **Coffeely**!
            
            #### ✨ Highlights & Features:
            - 🛡️ **100% Escrow Protection** for bookings and secure wallet payouts
            - 📹 **P2P WebRTC Video Calling** & high-definition voice calls
            - 💬 **Encrypted Real-Time Chat**, audio voice notes, and Ghost PIN mode
            - 🚨 **One-Tap GPS Emergency SOS** with live location broadcast
            - 🗺️ **Proximity Discovery Map** to find nearby verified companions
            - ⭐ **Verified Client Ratings** and trusted companion reviews
          files: coffeely.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
