<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentGF — Offline</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #0D0D1A;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: white;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 360px;
        }
        .emoji {
            font-size: 64px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(to right, #ec4899, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }
        p {
            color: #9ca3af;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        button {
            background: linear-gradient(to right, #ec4899, #a855f7);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        button:hover { opacity: 0.9; transform: scale(1.05); }
        button:active { transform: scale(0.95); }
        .hint {
            margin-top: 20px;
            color: #4b5563;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">📡</div>
        <h1>You're Offline</h1>
        <p>Internet connection nahi mil raha. Apna WiFi ya mobile data check karo aur dobara try karo.</p>
        <button onclick="window.location.reload()">🔄 Try Again</button>
        <div class="hint">RentGF will reconnect automatically when you're back online.</div>
    </div>
</body>
</html>
